<!DOCTYPE html>
<html lang="en">
<head>
    <title>Display a map</title>
    <meta property="og:description" content="Initialize a map in an HTML element with MapLibre GL JS." />
    <meta property="og:category" content="Getting Started" />
    <meta property="og:order" content="1" />
    <meta property="og:created" content="2025-06-25" />
    <meta charset='utf-8'>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel='stylesheet' href='https://unpkg.com/maplibre-gl@6.7.0/dist/maplibre-gl.css' />

    <style>
        body { margin: 0; padding: 0; }
        html, body, #map { height: 100%; }
    </style>
</head>
<body>
<div id="map"></div>
<script type="module">
    import * as maplibregl from 'https://unpkg.com/maplibre-gl@6.7.0/dist/maplibre-gl.mjs';

    const map = new maplibregl.Map({
        container: 'map', // container id
        style: 'https://demotiles.maplibre.org/style.json', // style URL
        center: [2.3, 49.9],  // Longitude, Latitude (centre approximatif de la Somme)
            zoom: 9,
        maplibreLogo: true
    });
   map.addControl(
    new maplibregl.NavigationControl(),
    'top-right'
    );
    map.on('load', () => {
        map.addSource('communes', {
            type: 'vector',
            url: 'http://localhost:3000/commune'
        });
        map.addSource('commune-label-point', {
                type: 'vector',
                url: 'http://localhost:3000/commune_label_point'
            });
        map.addLayer({
            id: 'communes-fill',
            type: 'fill',
            source: 'communes',
            'source-layer': 'commune',
            paint: {
                'fill-opacity': 0.5
            }
        });
        map.addLayer({
            id: 'commune-labels',
            type: 'symbol',
            source: 'commune-label-point',
            'source-layer': 'commune_label_point',
            layout: {
                'text-field': ['get', 'nom_officiel'],
                'text-size': 14,
                'text-allow-overlap': false
            }
        });
        /*
        map.addLayer({

</script>
</body>
</html>
